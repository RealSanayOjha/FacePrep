spring:
  application:
    name: student-management
  data:
    mongodb:
      uri: "${MONGODB_URI:mongodb://127.0.0.1:27017/student_management?serverSelectionTimeoutMS=5000&connectTimeoutMS=5000}"
      auto-index-creation: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: false

server:
  address: 0.0.0.0
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript
    min-response-size: 1024

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

app:
  indexes:
    auto-create: ${MONGO_AUTO_INDEX:true}
  seed-demo-data: ${SEED_DEMO_DATA:true}

logging:
  level:
    org.mongodb.driver: WARN
